<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhenomenalLayout — Advanced Layout Preservation Engine</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header id="app-header">
    <h1>PhenomenalLayout</h1>
    <p class="tagline">Zero host storage full-length book translation via Google Cloud Document Translation &amp; GCS.</p>
    <section id="auth-panel" aria-label="Authentication"></section>
  </header>
  <main id="app">
    <section id="cost-estimator" class="panel" aria-label="Cost estimator"></section>
    <section id="onboarding" class="panel" aria-label="GCP onboarding"></section>
    <section id="byok" class="panel" aria-label="BYOK setup"></section>
    <section id="prescan" class="panel" aria-label="Pre-scan and terminology"></section>
    <section id="translate" class="panel" aria-label="Translate"></section>
    <section id="dualpane" class="panel" aria-label="Dual-pane viewer"></section>
  </main>
  <footer>PhenomenalLayout — GCP Document Translation only; no locally synthesized pages.</footer>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
