[pytest]
pythonpath = .
addopts = -q -m "not frontend" --cov=services --cov=core --cov=api --cov=utils --cov-branch --cov-report=term-missing --cov-fail-under=70
asyncio_mode = auto
markers =
    load: marks tests as load/soak tests (deselect with '-m "not load"')
    slow: marks tests as slower-running integration/soak tests (deselect with '-m "not slow"')
    frontend: browser E2E specs (Playwright/Chromium); excluded from default runs because pytest-playwright and pytest-asyncio cannot share a process — run with 'pytest -m frontend tests/frontend'

# Allow focused runs by honoring FOCUSED=1 to disable coverage gates and heavy addopts.
# Usage:
#   FOCUSED=1 pytest tests/test_pdf_reconstruction.py -k parse_error
[pytest.environ]
FOCUSED = default
